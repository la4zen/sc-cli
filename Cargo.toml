[package]
name = "sc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.191"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }
zbus = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
